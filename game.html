<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYSTEM LOCKOUT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Share Tech Mono', monospace;
      color: #0f0;
      cursor: none; /* Hide default cursor */
    }

    /* Matrix canvas */
    canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Screen Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      pointer-events: none;
      text-align: center;
    }

    .box {
      background: rgba(0, 20, 0, 0.85);
      border: 2px solid #0f0;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
      padding: 30px 50px;
      border-radius: 12px;
      animation: pulse-border 2s infinite;
      pointer-events: auto;
    }

    h1 {
      font-size: 38px;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #0f0;
    }

    p {
      font-size: 18px;
      color: #8f8;
      margin-bottom: 25px;
    }

    .difficulty-bar {
      width: 100%;
      height: 10px;
      background: #020;
      border: 1px solid #0f0;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    .difficulty-progress {
      width: 100%;
      height: 100%;
      background: #0f0;
      transition: width 1s linear;
    }

    /* Custom Mouse Cursors */
    .cursor-user {
      position: fixed;
      width: 30px;
      height: 30px;
      border: 2px solid #ff3333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
    }
    
    .cursor-user::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      background: #ff3333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* Ghost Cursor (Evasive target) */
    .cursor-target {
      position: fixed;
      width: 19px;
      height: 24px;
      pointer-events: none;
      z-index: 99;
      transform: translate(-2px, -2px); /* Align cursor tip */
      transition: transform 0.05s ease-out;
    }

    /* Admin link */
    .admin-link {
      position: absolute;
      bottom: 15px;
      right: 15px;
      font-size: 12px;
      color: rgba(0, 255, 0, 0.4);
      cursor: pointer;
      text-decoration: underline;
      z-index: 20;
      pointer-events: auto;
    }
    
    .admin-link:hover {
      color: #0f0;
    }

    /* Success screen */
    .success-box {
      display: none;
      background: rgba(0, 30, 0, 0.95);
      border: 3px solid #00ff66;
      box-shadow: 0 0 40px rgba(0, 255, 102, 0.5);
      padding: 40px 60px;
      border-radius: 12px;
      text-align: center;
      z-index: 50;
      pointer-events: auto;
    }

    .success-box h2 {
      font-size: 42px;
      color: #00ff66;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #00ff66;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: #0f0; box-shadow: 0 0 30px rgba(0, 255, 0, 0.3); }
      50% { border-color: #008800; box-shadow: 0 0 15px rgba(0, 136, 0, 0.1); }
    }
  </style>
</head>
<body>

  <!-- Falling Matrix Code -->
  <canvas id="matrix"></canvas>

  <!-- Player Custom Cursor (Red crosshair) -->
  <div class="cursor-user" id="user-cursor"></div>

  <!-- Ghost Custom Cursor (Evasive arrow) -->
  <svg class="cursor-target" id="target-cursor" viewBox="0 0 24 24">
    <path fill="#ffffff" stroke="#000000" stroke-width="1.5" d="M4.5 3v15.2l4.4-4.3 3.1 7.2 2.8-1.2-3.1-7.2h6.1z"/>
  </svg>

  <!-- Lockout Overlay -->
  <div class="overlay" id="lockout-overlay">
    <div class="box" id="game-box">
      <h1>SYSTEM DECRYPTION LOCKOUT</h1>
      <p>Bewege dein Fadenkreuz und fange deinen entflohenen Cursor!</p>
      <div style="font-size: 14px; color: #a4ffa4;">Der Cursor weicht dir aus, wird aber mit der Zeit müde...</div>
      <div class="difficulty-bar">
        <div class="difficulty-progress" id="diff-progress"></div>
      </div>
    </div>

    <!-- Success Screen (Hidden initially) -->
    <div class="success-box" id="success-box">
      <h2>SYSTEM ENTSPERRT!</h2>
      <p>Du hast deinen Mauszeiger erfolgreich wieder eingefangen!</p>
      <button class="btn" onclick="window.close()" style="background: transparent; border: 1px solid #0f0; color: #0f0; padding: 8px 20px; font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 6px; margin-top: 10px; pointer-events: auto;">Fenster schließen</button>
    </div>
  </div>

  <div class="admin-link" id="admin-btn">Admin-Panel</div>

  <script>
    // ── Matrix Effect ──
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%+=-*<>[]';
    const fontSize = 16;
    let columns = canvas.width / fontSize;
    const drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = 1;
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    // ── Cursor Evasion Game ──
    const userCursor = document.getElementById('user-cursor');
    const targetCursor = document.getElementById('target-cursor');
    const diffProgress = document.getElementById('diff-progress');
    const gameBox = document.getElementById('game-box');
    const successBox = document.getElementById('success-box');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    // Target coordinates and velocity
    let tx = window.innerWidth / 3;
    let ty = window.innerHeight / 3;
    let vx = 3;
    let vy = 3;

    let forceFactor = 22; // Evasion strength (decreases over time)
    const minForce = 2.5;
    const maxTime = 40; // Seconds until target cursor stops running entirely
    let elapsedTime = 0;

    // Track real mouse movements
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      // Update custom red crosshair position
      userCursor.style.left = mouseX + 'px';
      userCursor.style.top = mouseY + 'px';
    });

    // Handle difficulty scaling over time
    const diffTimer = setInterval(() => {
      elapsedTime++;
      const pct = Math.max(0, 100 - (elapsedTime / maxTime) * 100);
      diffProgress.style.width = pct + '%';

      // Decrease evasion force
      forceFactor = Math.max(minForce, 22 - (elapsedTime / maxTime) * (22 - minForce));

      if (elapsedTime >= maxTime) {
        clearInterval(diffTimer);
      }
    }, 1000);

    // Game loop
    let isGameOver = false;

    function gameLoop() {
      if (isGameOver) return;

      // 1. Move target cursor using standard drift velocity
      tx += vx;
      ty += vy;

      // Bounce off screen boundaries
      if (tx < 10) { tx = 10; vx = Math.abs(vx); }
      if (tx > window.innerWidth - 25) { tx = window.innerWidth - 25; vx = -Math.abs(vx); }
      if (ty < 10) { ty = 10; vy = Math.abs(vy); }
      if (ty > window.innerHeight - 30) { ty = window.innerHeight - 30; vy = -Math.abs(vy); }

      // 2. Calculate vector from user crosshair to target cursor
      const dx = tx - mouseX;
      const dy = ty - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Evasion behavior: push away if user is close
      if (dist < 260) {
        const pushForce = (1 - dist / 260) * forceFactor;
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        vx += nx * pushForce * 0.25;
        vy += ny * pushForce * 0.25;

        // Apply friction/speed limit
        const maxSpeed = 16;
        const currentSpeed = Math.sqrt(vx * vx + vy * vy);
        if (currentSpeed > maxSpeed) {
          vx = (vx / currentSpeed) * maxSpeed;
          vy = (vy / currentSpeed) * maxSpeed;
        }
      } else {
        vx *= 0.98;
        vy *= 0.98;
      }

      // Render target cursor
      targetCursor.style.left = tx + 'px';
      targetCursor.style.top = ty + 'px';

      // 3. Collision check: Did we catch the cursor?
      if (dist < 16) {
        endGame();
      }

      requestAnimationFrame(gameLoop);
    }
    
    // Start game loop
    requestAnimationFrame(gameLoop);

    function endGame() {
      isGameOver = true;
      clearInterval(diffTimer);
      
      // Hide red cursor, show normal cursor
      userCursor.style.display = 'none';
      document.body.style.cursor = 'default';

      // Show success popup
      gameBox.style.display = 'none';
      successBox.style.display = 'block';

      // Exit fullscreen if active
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }

      // Play success speech
      try {
        const utterance = new SpeechSynthesisUtterance("System entsperrt. Du hast deinen Cursor wieder eingefangen.");
        utterance.lang = "de-DE";
        window.speechSynthesis.speak(utterance);
      } catch(_) {}
    }

    // ── Admin Dialog ──
    document.getElementById('admin-btn').addEventListener('click', () => {
      const password = prompt("Bitte Admin-Passwort eingeben:");
      if (password === "admin") {
        alert("Admin-Modus entsperrt!\n\nBitte führe die Datei 'Reset_PC.vbs' auf deinem USB-Stick aus, um dein altes Hintergrundbild und den Windows-Autostart wiederherzustellen.");
      } else if (password !== null) {
        alert("Falsches Passwort!");
      }
    });

    // ── Automatic Fullscreen & Audio Activation ──
    let interactionTriggered = false;
    
    function triggerFullscreenAndVoice() {
      if (interactionTriggered) return;
      interactionTriggered = true;
      
      // Request Fullscreen
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      
      // Play voice announcement
      try {
        const utterance = new SpeechSynthesisUtterance("Achtung! USB-Stick drollolol erkannt. Starte Download von geheimen Daten. Selbstzerstörung eingeleitet.");
        utterance.lang = "de-DE";
        window.speechSynthesis.speak(utterance);
      } catch(_) {}
    }

    // Bind to mouse movement and clicks to bypass browser autoplay/fullscreen security
    document.addEventListener('mousemove', triggerFullscreenAndVoice);
    document.addEventListener('click', triggerFullscreenAndVoice);
  </script>

</body>
</html>
